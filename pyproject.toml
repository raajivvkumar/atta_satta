[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "atta-satta"
version = "0.1.0"
description = "Historical lottery analysis and experimental prediction research platform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Raajivv Kumar" },
]
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
documents = [
  "PyMuPDF>=1.24,<2",
  "pdfplumber>=0.11,<1",
]
ocr = [
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10.4,<12",
  "pytesseract>=0.3.13,<1",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atta_satta"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
